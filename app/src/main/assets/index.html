<!doctype html>
<html lang="az" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تورک تقویمی</title>
<style>
:root{--bg:#f6f4ef;--sf:#fff;--tx:#1d1d1b;--mu:#6b6a63;--bd:#e0ddd3;--ac:#2a7f62;--k1:#c0502f;--k2:#2a7f62;--k3:#3b6fb6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--sf:#232427;--tx:#eceae4;--mu:#9a988f;--bd:#34353a;--ac:#5fc2a0;--k1:#e0806a;--k2:#5fc2a0;--k3:#7ba7e6}}
:root[data-theme="dark"]{--bg:#17181a;--sf:#232427;--tx:#eceae4;--mu:#9a988f;--bd:#34353a;--ac:#5fc2a0;--k1:#e0806a;--k2:#5fc2a0;--k3:#7ba7e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
h1{font-size:20px;margin:0}
button{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:0 12px 12px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--sf)}
nav button{flex:1;border:0;border-radius:0;padding:12px;background:none;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:700}
.mh{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.mh .t{font-size:18px;font-weight:700;background:none;border:0}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.w{text-align:center;color:var(--mu);font-size:10px;line-height:1.2;padding:2px 0}
.d{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--sf);border:1px solid var(--bd);padding:0}
.d.e{background:none;border:0}
.d.td{border-color:var(--ac);border-width:2px}
.d.sel{background:var(--ac);color:#fff}
.d i{display:flex;gap:2px;height:6px;margin-top:2px}
.d i b{width:6px;height:6px;border-radius:50%}
.k1{background:var(--k1)}.k2{background:var(--k2)}.k3{background:var(--k3)}
.d.sel i b{outline:1px solid #fff}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px}
.card h3{margin:0 0 2px;font-size:17px}
.sub{color:var(--mu);font-size:13px}
.ev{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bd);align-items:center}
.ev:first-of-type{border-top:0}
.ev .dot{width:10px;height:10px;border-radius:50%;flex:none}
.ev div{flex:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pk button{padding:14px 4px}.pk button.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button.on{background:var(--ac);color:#fff}
input,select{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
h2{font-size:15px;color:var(--mu);margin:16px 0 4px}
</style></head><body>
<header><h1>تورک تقویمی</h1><button id="today">بوگون</button></header>
<main id="m"></main>
<nav><button data-t="cal" class="on">تقویم</button><button data-t="ev">اولایلار</button><button data-t="set">تنظیمات</button></nav>
<script>
const AM=["آغلار گولر","گولن آی","قیزاران آی","قورا بیشیرن","قویروق دوغان","زومار آیی","خەزەل آیی","قیروو آیی","آذر","چیله","دوندران آی","بایرام آیی"];
const HM=["محرم","صفر","ربیع‌الاول","ربیع‌الثانی","جمادی‌الاول","جمادی‌الثانی","رجب","شعبان","رمضان","شوال","ذیقعده","ذیحجه"];
const WD=["یئل لی گون","سود گونو","دوز گونو","آرا گون","اود گونو","سو گونو","آینی گونو"];
const KN={1:"تاریخی",2:"فرهنگی",3:"دینی"};
/* r: s=شمسی [ay,گون]  h=هجری [ay,گون]  g=میلادی [ay,گون]  r=null -> تاریخ تعیین اولوناجاق */
const EV=[
{id:1,n:"محمد امین رسولزاده",t:"تاریخی شخصیت",d:"دوغوم گونو",k:1,r:{g:[1,31]}},
{id:2,n:"محمد امین رسولزاده",t:"تاریخی شخصیت",d:"اؤلوم گونو",k:1,r:{g:[3,6]}},
{id:3,n:"مصطفی کمال آتاتورک",t:"تاریخی شخصیت",d:"دوغوم گونو",k:1,r:null},
{id:4,n:"مصطفی کمال آتاتورک",t:"تاریخی شخصیت",d:"اؤلوم گونو",k:1,r:{g:[11,10]}},
{id:5,n:"ابوالفضل ائلچی‌بی",t:"تاریخی شخصیت",d:"دوغوم گونو",k:1,r:{g:[6,24]}},
{id:6,n:"ابوالفضل ائلچی‌بی",t:"تاریخی شخصیت",d:"اؤلوم گونو",k:1,r:{g:[8,22]}},
{id:7,n:"ستارخان",t:"تاریخی شخصیت",d:"یاد گونو",k:1,r:null},
{id:8,n:"باقرخان",t:"تاریخی شخصیت",d:"یاد گونو",k:1,r:null},
{id:9,n:"شیخ محمد خیابانی",t:"تاریخی شخصیت",d:"یاد گونو",k:1,r:null},
{id:10,n:"تبریز مشروطه‌سی",t:"تاریخی",d:"مشروطه حرکاتی",k:1,r:null},
{id:11,n:"۲۱ آذر",t:"تاریخی",d:"آذربایجان میلّی حکومتی",k:1,r:{s:[9,21]}},
{id:12,n:"نوروز بایرامی",t:"میلّی و فرهنگی",d:"باهار و یئنی ایل بایرامی",k:2,r:{s:[1,1]}},
{id:13,n:"چهارشنبه‌سوری",t:"فرهنگی",d:"باهار قارشیلاماسی",k:2,r:null},
{id:14,n:"چیلله گئجه‌سی",t:"فرهنگی",d:"قیشین اوزون گئجه‌سی",k:2,r:{s:[9,30]}},
{id:15,n:"مهرگان",t:"فرهنگی",d:"کهن بایرام",k:2,r:{s:[7,16]}},
{id:16,n:"رمضان",t:"دینی",d:"اوروج آیی",k:3,r:{h:[9,1]}},
{id:17,n:"قدر گئجه‌سی",t:"دینی",d:"قدر گئجه‌سی",k:3,r:{h:[9,21]}},
{id:18,n:"عید فطر",t:"دینی",d:"رمضان بایرامی",k:3,r:{h:[10,1]}},
{id:19,n:"عید قربان",t:"دینی",d:"قربان بایرامی",k:3,r:{h:[12,10]}},
{id:20,n:"غدیر خم",t:"دینی",d:"غدیر گونو",k:3,r:{h:[12,18]}},
{id:21,n:"تاسوعا",t:"دینی",d:"محرم آیی",k:3,r:{h:[1,9]}},
{id:22,n:"عاشورا",t:"دینی",d:"محرم آیی",k:3,r:{h:[1,10]}},
{id:23,n:"اربعین",t:"دینی",d:"اربعین گونو",k:3,r:{h:[2,20]}},
{id:24,n:"میلاد پیامبر",t:"دینی",d:"مولود گونو",k:3,r:{h:[3,17]}},
{id:25,n:"میلاد امام علی",t:"دینی",d:"۱۳ رجب",k:3,r:{h:[7,13]}},
{id:26,n:"نیمه شعبان",t:"دینی",d:"۱۵ شعبان",k:3,r:{h:[8,15]}},
{id:27,n:"آتا بابک",t:"تاریخی شخصیت",d:"دوغوم گونو",k:1,r:{s:[4,10]}}
];

const fa=s=>String(s).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const pf=new Intl.DateTimeFormat("en-u-ca-persian-nu-latn",{year:"numeric",month:"numeric",day:"numeric"});
const hf=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{year:"numeric",month:"numeric",day:"numeric"});
const pr=(f,d)=>{const o={};f.formatToParts(d).forEach(p=>{o[p.type]=parseInt(p.value,10)});return o};
let st={cu:{},off:0,sh:1,sg:1,th:"auto",nt:0,nh:"08:00"};
try{const x=localStorage.getItem("tt");if(x)st=Object.assign(st,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("tt",JSON.stringify(st))}catch(e){}};
const applyTheme=()=>{const r=document.documentElement;if(st.th=="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",st.th)};applyTheme();
const noon=(y,m,d)=>new Date(y,m,d,12);
const P=g=>pr(pf,g), H=g=>pr(hf,new Date(g.getTime()+st.off*864e5));
const add=(g,n)=>new Date(g.getTime()+n*864e5);
const nowruz=y=>{let d=noon(y+621,2,17);for(let i=0;i<12;i++){const p=P(d);if(p.month==1&&p.day==1)return d;d=add(d,1)}return d};
const mlen=m=>m<=6?31:m<=11?30:0;
function mstart(y,m){let d=nowruz(y);for(let i=1;i<m;i++)d=add(d,mlen(i));return d}
function mdays(y,m){return m<12?mlen(m):Math.round((nowruz(y+1)-mstart(y,12))/864e5)}
function evFor(g){const p=P(g),h=H(g),gm=g.getMonth()+1,gd=g.getDate();
 return EV.filter(e=>{let r=e.r;const c=st.cu[e.id];if(c)r={s:c};if(!r)return false;
  if(r.s)return r.s[0]==p.month&&r.s[1]==p.day;
  if(r.h)return r.h[0]==h.month&&r.h[1]==h.day;
  return r.g[0]==gm&&r.g[1]==gd})}
const t0=noon(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
let tp=P(t0);
let S={y:tp.year,m:tp.month,sel:t0,tab:"cal",f:0,q:""};
const $=s=>document.querySelector(s);
const same=(a,b)=>a.toDateString()==b.toDateString();
const dots=l=>"<i>"+[...new Set(l.map(e=>e.k))].map(k=>`<b class="k${k}"></b>`).join("")+"</i>";
function dayCard(){const g=S.sel,p=P(g),h=H(g),l=evFor(g);
 const gs=g.toLocaleDateString("az",{day:"numeric",month:"long",year:"numeric"});
 return `<div class="card"><h3>${WD[(g.getDay()+1)%7]} · ${AM[p.month-1]} — ${fa(p.day)}</h3>
 <div class="sub">${[st.sg?gs:"",st.sh?fa(h.day)+" "+HM[h.month-1]+" "+fa(h.year):""].filter(Boolean).join(" · ")}</div>
 ${l.length?l.map(e=>`<div class="ev"><span class="dot k${e.k}"></span><div>${e.n}<div class="sub">${e.t} — ${e.d}</div></div></div>`).join(""):`<div class="sub" style="padding-top:8px">بو گون اوچون اولای یوخدور</div>`}</div>`}
function cal(){const n=mdays(S.y,S.m),s=mstart(S.y,S.m),off=(s.getDay()+1)%7;
 let h=`<div class="mh"><button id="nx">‹</button><button class="t" id="pk">${AM[S.m-1]} ${fa(S.y)}</button><button id="pv">›</button></div><div class="g">`;
 WD.forEach(w=>h+=`<div class="w">${w}</div>`);
 for(let i=0;i<off;i++)h+=`<div class="d e"></div>`;
 for(let i=1;i<=n;i++){const g=add(s,i-1);h+=`<button class="d${same(g,t0)?" td":""}${same(g,S.sel)?" sel":""}" data-i="${i-1}">${fa(i)}${dots(evFor(g))}</button>`}
 $("#m").innerHTML=h+"</div>"+dayCard()+yearCard();
 $("#nx").onclick=()=>step(1);$("#pv").onclick=()=>step(-1);$("#pk").onclick=picker;
 document.querySelectorAll(".d[data-i]").forEach(b=>b.onclick=()=>{S.sel=add(s,+b.dataset.i);cal()})}
function step(d){S.m+=d;if(S.m>12){S.m=1;S.y++}if(S.m<1){S.m=12;S.y--}cal()}
function picker(){const o=document.createElement("div");o.className="ov";
 o.innerHTML=`<div class="sh"><div class="mh"><button id="y1">‹</button><b>${fa(S.y)}</b><button id="y2">›</button></div><div class="pk">${AM.map((a,i)=>`<button data-m="${i+1}" class="${i+1==S.m?"on":""}">${a}</button>`).join("")}</div></div>`;
 document.body.appendChild(o);
 o.onclick=e=>{if(e.target==o)o.remove()};
 o.querySelector("#y1").onclick=()=>{S.y++;o.remove();picker()};
 o.querySelector("#y2").onclick=()=>{S.y--;o.remove();picker()};
 o.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.m=+b.dataset.m;o.remove();cal()})}
function evs(){const q=S.q.trim();let up=[];
 for(let i=0;i<380;i++){const g=add(t0,i);evFor(g).forEach(e=>up.push({g,e}))}
 up=up.filter(x=>(!S.f||x.e.k==S.f)&&(!q||x.e.n.includes(q)));
 const pend=EV.filter(e=>!e.r&&!st.cu[e.id]&&(!S.f||e.k==S.f)&&(!q||e.n.includes(q)));
 const ch=[[0,"همه"],[1,"تاریخی"],[2,"فرهنگی"],[3,"دینی"]].map(c=>`<button data-f="${c[0]}" class="${S.f==c[0]?"on":""}">${c[1]}</button>`).join("");
 let h=`<input id="q" placeholder="آختار" value="${S.q}"><div class="chips">${ch}</div>`;
 h+=up.map(x=>{const p=P(x.g);return `<div class="card ev" style="margin-top:8px"><span class="dot k${x.e.k}"></span><div>${x.e.n}<div class="sub">${x.e.t} — ${x.e.d}</div><div class="sub">${fa(p.day)} ${AM[p.month-1]} ${fa(p.year)}</div></div></div>`}).join("")||`<div class="sub">اولای تاپیلمادی</div>`;
 if(pend.length)h+=`<h2>تاریخ تعیین اولوناجاق</h2>`+pend.map(e=>`<div class="card ev" style="margin-top:8px"><span class="dot k${e.k}"></span><div>${e.n}<div class="sub">${e.t} — ${e.d}</div></div><button data-p="${e.id}">تاریخ تعیین ائت</button></div>`).join("");
 $("#m").innerHTML=h;
 $("#q").oninput=e=>{S.q=e.target.value;evs();const i=$("#q");i.focus();i.setSelectionRange(i.value.length,i.value.length)};
 document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.f=+b.dataset.f;evs()});
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>setDate(+b.dataset.p))}
function setDate(id){const v=prompt("ay و گون (مثال: 5 12) — شمسی تقویم",""); if(!v)return;
 const a=v.trim().split(/\s+/).map(Number);if(a.length!=2||a.some(isNaN)||a[0]<1||a[0]>12||a[1]<1||a[1]>31)return alert("یانلیش فورمات");
 st.cu[id]=a;save();evs()}
function sets(){$("#m").innerHTML=`<div class="card"><h3>هجری تاریخ دوزلتمه‌سی</h3><div class="sub" style="margin-bottom:8px">دینی گونلر اؤلکه‌یه گؤره 1 گون فرقلی اولا بیلر</div>
 <select id="of">${[-2,-1,0,1,2].map(v=>`<option value="${v}" ${v==st.off?"selected":""}>${v>0?"+":""}${fa(v)}</option>`).join("")}</select></div>
 <div class="card"><h3>گؤستریلن تاریخلر</h3><label style="display:block;padding:6px 0"><input type="checkbox" id="sg" style="width:auto" ${st.sg?"checked":""}> میلادی</label><label style="display:block;padding:6px 0"><input type="checkbox" id="sh" style="width:auto" ${st.sh?"checked":""}> قمری</label></div><div class="card"><h3>گئجه مودی</h3><select id="th"><option value="auto">اوتوماتیک</option><option value="light">ایشیقلی</option><option value="dark">قارانلیق</option></select></div><div class="card"><h3>گونلوک بیلدیریش</h3><label style="display:block;padding:6px 0"><input type="checkbox" id="nt" style="width:auto"> هر گون بیلدیریش</label><input type="time" id="nh"><div class="sub" id="ns" style="margin-top:6px"></div></div><div class="card"><button id="rs">اؤزل تاریخلری سیل</button></div>`;
 $("#th").value=st.th;$("#nt").checked=!!st.nt;$("#nh").value=st.nh;$("#th").onchange=e=>{st.th=e.target.value;save();applyTheme()};$("#nt").onchange=e=>{st.nt=e.target.checked?1:0;save();notif(true)};$("#nh").onchange=e=>{st.nh=e.target.value||"08:00";save();notif(false)};if(!window.Native)$("#ns").textContent="بیلدیریش یالنیز اپلیکاسیادا ایشلیر";
 $("#of").onchange=e=>{st.off=+e.target.value;save()};$("#sg").onchange=e=>{st.sg=e.target.checked?1:0;save()};$("#sh").onchange=e=>{st.sh=e.target.checked?1:0;save()};
 $("#rs").onclick=()=>{st.cu={};save();alert("سیلیندی")}}
function go(t){S.tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));({cal,ev:evs,set:sets})[t]()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
$("#today").onclick=()=>{S.y=tp.year;S.m=tp.month;S.sel=t0;go("cal")};
function equinox(year){
 const Y=(year-2000)/1000,r=Math.PI/180;
 const J0=2451623.80984+365242.37404*Y+0.05169*Y*Y-0.00411*Y*Y*Y-0.00057*Y*Y*Y*Y;
 const T=(J0-2451545)/36525,W=35999.373*T-2.47;
 const dl=1+0.0334*Math.cos(W*r)+0.0007*Math.cos(2*W*r);
 const A=[[485,324.96,1934.136],[203,337.23,32964.467],[199,342.08,20.186],[182,27.85,445267.112],[156,73.14,45036.886],[136,171.52,22518.443],[77,222.54,65928.934],[74,296.72,3034.906],[70,243.58,9037.513],[58,119.81,33718.147],[52,297.17,150.678],[50,21.02,2281.226],[45,247.54,29929.562],[44,325.15,31555.956],[29,60.93,4443.417],[18,155.12,67555.328],[17,288.79,4562.452],[16,198.04,62894.029],[14,199.76,31436.921],[12,95.39,14577.848],[12,287.11,31931.756],[12,320.81,34777.259],[9,227.73,1222.114],[8,15.45,16859.074]];
 let S=0;A.forEach(a=>{S+=a[0]*Math.cos((a[1]+a[2]*T)*r)});
 const J=J0+0.00001*S/dl-69/86400;
 return Math.round((J-2440587.5)*864e5)}
function yearCard(){const now=Date.now();let e=equinox(new Date().getFullYear());if(e<=now)e=equinox(new Date().getFullYear()+1);
 const ms=e-now,d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),py=P(new Date()).year+1;
 const o={day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"};
 const tz=new Date(e).toLocaleString("az",Object.assign({timeZone:"Asia/Tehran"},o));
 const lc=new Date(e).toLocaleString("az",o);
 return `<div class="card"><h3>یئنی ایل ${fa(py)}</h3><div class="sub">${fa(d)} گون ${fa(h)} ساعت قالیب</div><div class="sub">تحویل (تهران): ${tz}</div><div class="sub">تحویل (محلی): ${lc}</div></div>`}
function notif(ask){const N=window.Native,ns=$("#ns");
 if(!N){if(ns)ns.textContent="بیلدیریش یالنیز اپلیکاسیادا ایشلیر";return}
 if(!st.nt){N.schedule("[]");return}
 if(ask)N.askPermission();
 const hm=(st.nh||"08:00").split(":").map(Number),out=[];
 for(let i=0;i<45;i++){const g=add(t0,i);const at=new Date(g.getFullYear(),g.getMonth(),g.getDate(),hm[0],hm[1],0).getTime();if(at<=Date.now())continue;
  const p=P(g),l=evFor(g);
  out.push({at:at,t:WD[(g.getDay()+1)%7]+" · "+AM[p.month-1]+" "+fa(p.day),x:l.length?l.map(e=>e.n+" — "+e.d).join("\n"):g.toLocaleDateString("az",{day:"numeric",month:"long",year:"numeric"})})}
 N.schedule(JSON.stringify(out))}
